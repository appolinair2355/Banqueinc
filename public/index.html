<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>PayZone Afrique</title>
<meta name="description" content="PayZone Afrique — Wave, Attijari Wafabank, Wafacash et CIH Bank depuis un seul portail."/>
<link rel="stylesheet" href="portal.css"/>
</head>
<body>

<header class="portal-header">
  <div class="portal-logo">
    <!-- PayZone "P" icon -->
    <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="4" width="28" height="28" rx="8" fill="white" opacity=".2"/>
      <text x="18" y="26" text-anchor="middle" font-family="'Arial Black',sans-serif" font-weight="900" font-size="22" fill="white">P</text>
    </svg>
  </div>
  <h1 class="portal-title">PayZone Afrique</h1>
  <p class="portal-sub">Vos banques &amp; mobile money, un seul portail.</p>
</header>

<p class="section-label">Sélectionnez votre service</p>

<div class="portal-grid">

  <!-- ── WAVE ── -->
  <a href="wave.html" class="bank-card" style="background:linear-gradient(145deg,#1DC4F5,#0b8abf);color:#fff">
    <!-- Penguin logo -->
    <svg class="bank-card-logo" viewBox="0 0 70 80" xmlns="http://www.w3.org/2000/svg">
      <!-- body -->
      <ellipse cx="35" cy="57" rx="22" ry="22" fill="white"/>
      <!-- belly -->
      <ellipse cx="35" cy="62" rx="13" ry="15" fill="#1DC4F5"/>
      <!-- head -->
      <circle cx="35" cy="24" r="18" fill="white"/>
      <!-- eye whites -->
      <circle cx="27" cy="20" r="5" fill="#0b2a5b"/>
      <circle cx="43" cy="20" r="5" fill="#0b2a5b"/>
      <!-- eye shine -->
      <circle cx="28.5" cy="19" r="2" fill="white"/>
      <circle cx="44.5" cy="19" r="2" fill="white"/>
      <!-- beak -->
      <path d="M35 28 L30 35 L40 35 Z" fill="#FF8C00"/>
      <!-- left wing waving -->
      <path d="M14 46 C7 33 10 16 20 14 C24 12 27 20 25 29 Z" fill="white"/>
      <!-- right wing -->
      <ellipse cx="56" cy="56" rx="10" ry="20" transform="rotate(12,56,56)" fill="white"/>
      <!-- feet -->
      <ellipse cx="26" cy="76" rx="12" ry="5" fill="#FF8C00"/>
      <ellipse cx="44" cy="76" rx="12" ry="5" fill="#FF8C00"/>
    </svg>
    <div>
      <div class="bank-card-name">Wave</div>
      <div class="bank-card-tag">Mobile Money</div>
    </div>
  </a>

  <!-- ── ATTIJARI WAFABANK ── -->
  <a href="attijari.html" class="bank-card" style="background:linear-gradient(145deg,#C8102E,#8a0010);color:#fff">
    <!-- Attijariwafabank rosette emblem -->
    <svg class="bank-card-logo" viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">
      <!-- outer circle white -->
      <circle cx="35" cy="35" r="32" fill="white"/>
      <!-- 8-petal rosette in red — signature Attijariwafabank emblem -->
      <g transform="translate(35,35)">
        <ellipse rx="9" ry="20" fill="#C8102E"/>
        <ellipse rx="9" ry="20" transform="rotate(45)" fill="#C8102E"/>
        <ellipse rx="9" ry="20" transform="rotate(90)" fill="#C8102E"/>
        <ellipse rx="9" ry="20" transform="rotate(135)" fill="#C8102E"/>
      </g>
      <!-- center circle white -->
      <circle cx="35" cy="35" r="11" fill="white"/>
      <!-- center dot orange -->
      <circle cx="35" cy="35" r="6" fill="#F7941D"/>
    </svg>
    <div>
      <div class="bank-card-name">Attijari Wafabank</div>
      <div class="bank-card-tag">Banque</div>
    </div>
  </a>

  <!-- ── WAFACASH ── -->
  <a href="wafacash.html" class="bank-card" style="background:linear-gradient(145deg,#F7941D,#c96d00);color:#fff">
    <!-- Wafacash W logo -->
    <svg class="bank-card-logo" viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">
      <!-- background circle white -->
      <circle cx="35" cy="35" r="32" fill="white"/>
      <!-- Bold "W" shape in orange — two downward arcs forming W -->
      <path d="M12 18 L20 52 L35 30 L50 52 L58 18" fill="none" stroke="#F7941D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- green accent bar at bottom -->
      <rect x="14" y="56" width="42" height="5" rx="2.5" fill="#00A651"/>
    </svg>
    <div>
      <div class="bank-card-name">Wafacash</div>
      <div class="bank-card-tag">Transfert d'argent</div>
    </div>
  </a>

  <!-- ── CIH BANK ── -->
  <a href="cih.html" class="bank-card" style="background:linear-gradient(145deg,#005F30,#003d1f);color:#fff">
    <!-- CIH Bank logo -->
    <svg class="bank-card-logo" viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">
      <!-- white rounded background -->
      <rect x="3" y="3" width="64" height="64" rx="16" fill="white"/>
      <!-- CIH text in green -->
      <text x="35" y="38" text-anchor="middle" font-family="'Arial Black','Arial',sans-serif" font-weight="900" font-size="19" fill="#005F30" letter-spacing="-1">CIH</text>
      <!-- accent bar below text -->
      <rect x="15" y="45" width="40" height="4" rx="2" fill="#005F30"/>
      <!-- left bracket decoration -->
      <rect x="10" y="20" width="4" height="30" rx="2" fill="#7BC67E"/>
      <!-- right bracket decoration -->
      <rect x="56" y="20" width="4" height="30" rx="2" fill="#7BC67E"/>
    </svg>
    <div>
      <div class="bank-card-name">CIH Bank</div>
      <div class="bank-card-tag">Banque</div>
    </div>
  </a>

</div>

<p class="portal-footer">© 2025 PayZone Afrique — Tous droits réservés</p>

</body>
</html>
