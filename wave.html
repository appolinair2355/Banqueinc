<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Wave</title>
<link rel="icon" href="wave.png" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f6f8; color: #0b1e4b; padding-bottom: 40px; }
  .topbar { background: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; position: relative; }
  .topbar .logo { height: 26px; }
  .topbar .icons { display: flex; gap: 16px; color: #0b1e4b; }
  .topbar .icons svg { width: 22px; height: 22px; }
  .back { color: #0b1e4b; font-size: 26px; text-decoration: none; line-height: 1; font-weight: 300; }

  .balance-card { background: #e5e7eb; padding: 20px 16px 26px; text-align: center; }
  .balance-label { font-size: 12px; letter-spacing: 2.5px; color: #6b7280; font-weight: 600; }
  .balance-amount { margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .balance-amount .amt { font-size: 40px; font-weight: 900; color: #0b1e4b; font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif; letter-spacing: -0.5px; }
  .balance-amount .eye { color: #6b7280; cursor: pointer; display: inline-flex; align-items: center; }
  .balance-amount .eye svg { width: 22px; height: 22px; }

  .encaisser { margin: 14px 12px 0; background: #29c0f0; color: #fff; border: 0; padding: 15px; width: calc(100% - 24px); border-radius: 6px; font-size: 15px; font-weight: 700; letter-spacing: 1.2px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
  .encaisser svg { width: 22px; height: 22px; }

  .actions { background: #fff; margin-top: 12px; padding: 18px 4px 22px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 0; }
  .action { text-align: center; cursor: pointer; }
  .action .circle { width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; }
  .action .circle svg { width: 26px; height: 26px; }
  .action .label { font-size: 13px; color: #0b1e4b; font-weight: 500; line-height: 1.2; }
  .c-blue { background: #dbeafe; color: #2563eb; }
  .c-sky { background: #e0f2fe; color: #0ea5e9; }
  .c-orange { background: #ffedd5; color: #f97316; }
  .c-green { background: #dcfce7; color: #16a34a; }
  .c-pink { background: #fce7f3; color: #ec4899; }
  .badge-free { display: inline-block; background: #22c55e; color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 4px; margin-top: 3px; font-weight: 600; }

  .tx-list { background: #fff; margin-top: 10px; }
  .tx { display: flex; align-items: flex-start; padding: 14px 16px; border-bottom: 1px solid #f1f2f4; gap: 14px; }
  .tx-icon { width: 30px; display: flex; align-items: center; justify-content: center; color: #2563eb; flex-shrink: 0; margin-top: 4px; }
  .tx-icon svg { width: 26px; height: 26px; }
  .tx-body { flex: 1; }
  .tx-title { font-size: 15px; font-weight: 700; color: #0b1e4b; line-height: 1.3; }
  .tx-meta { font-size: 12px; color: #6b7280; margin-top: 3px; }
  .tx-amount { font-size: 15px; font-weight: 700; color: #0b1e4b; white-space: nowrap; margin-left: 8px; margin-top: 2px; }
</style>
</head>
<body>
  <div class="topbar">
    <a href="/" class="back">‹</a>
    <img class="logo" src="wave.png" alt="Wave" />
    <div class="icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </div>
  </div>

  <div class="balance-card">
    <div class="balance-label">SOLDE</div>
    <div class="balance-amount">
      <span class="amt" id="balance">0F</span>
      <span class="eye" id="eyeBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </span>
    </div>
  </div>

  <button class="encaisser" onclick="alert('Scanner QR client')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
    ENCAISSER UN CLIENT
  </button>

  <div class="actions">
    <div class="action" onclick="doAction('Transfert')">
      <div class="circle c-blue">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"/></svg>
      </div>
      <div class="label">Transfert</div>
    </div>
    <div class="action" onclick="doAction('Payer marchand')">
      <div class="circle c-sky">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4v2l2 4h12l2-4V4zM6 12v8h4v-5h4v5h4v-8H6z"/><rect x="9" y="14" width="6" height="4" fill="#fff" opacity="0.6"/></svg>
      </div>
      <div class="label">Payer<br/>marchand</div>
      <span class="badge-free">Sans frais</span>
    </div>
    <div class="action" onclick="doAction('Envoi de lien')">
      <div class="circle c-orange">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </div>
      <div class="label">Envoi de lien</div>
    </div>
    <div class="action" onclick="doAction('Retrait')">
      <div class="circle c-green">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="6" width="20" height="12" rx="1.5"/><circle cx="12" cy="12" r="3" fill="#dcfce7"/><circle cx="5" cy="9" r="0.8" fill="#dcfce7"/><circle cx="19" cy="15" r="0.8" fill="#dcfce7"/></svg>
      </div>
      <div class="label">Retrait</div>
    </div>
    <div class="action" onclick="doAction('Coffre')">
      <div class="circle c-pink">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="14" cy="12" r="3.2" fill="#fce7f3"/><circle cx="14" cy="12" r="1.2"/><rect x="4" y="18" width="2" height="3"/><rect x="18" y="18" width="2" height="3"/><rect x="5" y="10" width="4" height="1.2" fill="#fce7f3"/></svg>
      </div>
      <div class="label">Coffre</div>
    </div>
  </div>

  <div class="tx-list" id="txList"></div>

<script>
  const ICONS = {
    refund: '<svg viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><rect x="9" y="10" width="8" height="6" rx="1" fill="#6b7280" stroke="none"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="#6b7280"><path d="M12 3v12l-4-4-1.4 1.4L12 18l5.4-5.6L16 11l-4 4V3z"/></svg>',
    cart: '<svg viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.5"/><circle cx="18" cy="21" r="1.5"/><path d="M2 3h3l2.7 13.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>'
  };
  const txs = [
    { icon: ICONS.refund, title: 'Remboursement à Zalle W', meta: 'Juil. 24, 13:02 • Kouao Desire Amangoa', amount: '-505F' },
    { icon: ICONS.phone, title: 'Vendu à Zalle W 01 50 34 1201', meta: 'Juil. 24, 13:01 • Kouao Desire Amangoa', amount: '505F' },
    { icon: ICONS.down, title: 'Fonds transférés vers Kouao Desire Amangoa 01 52 22 0436', meta: 'Juil. 22, 07:44 • Kouao Desire Amangoa', amount: '-11.925F' },
    { icon: ICONS.cart, title: 'Vendu à Dagoue A O L M', meta: 'Juil. 20, 17:56 • Kouao Desire Amangoa', amount: '10.500F' },
    { icon: ICONS.phone, title: 'Vendu à Zalle W 01 50 34 1201', meta: 'Juil. 20, 00:12 • Kouao Desire Amangoa', amount: '505F' },
    { icon: ICONS.phone, title: 'Vendu à Kone A', meta: 'Juil. 19, 15:22 • Kouao Desire Amangoa', amount: '2.020F' },
    { icon: ICONS.down, title: 'Fonds transférés vers Kouao Desire Amangoa', meta: 'Juil. 18, 09:10 • Kouao Desire Amangoa', amount: '-5.500F' }
  ];
  const list = document.getElementById('txList');
  txs.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tx';
    el.innerHTML = `<div class="tx-icon">${t.icon}</div><div class="tx-body"><div class="tx-title">${t.title}</div><div class="tx-meta">${t.meta}</div></div><div class="tx-amount">${t.amount}</div>`;
    list.appendChild(el);
  });

  let hidden = true;
  const bal = document.getElementById('balance');
  document.getElementById('eyeBtn').onclick = () => {
    hidden = !hidden;
    bal.textContent = hidden ? '0F' : '0F';
  };

  function doAction(name) { alert(name + ' — bientôt disponible'); }
</script>
</body>
</html>
