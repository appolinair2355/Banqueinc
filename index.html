<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PayZone Afrique — Wave, Attijari, Wafacash, CIH</title>
<meta name="description" content="PayZone Afrique — accédez à Wave, Attijari Bank, Wafacash et CIH Bank depuis un seul portail sécurisé."/>
<link rel="icon" href="favicon.ico"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="home">
  <header>
    <div class="brand">P</div>
    <h1>PayZone Afrique</h1>
    <p class="sub">Vos banques et mobile money, un seul portail.</p>
  </header>
  <main>
    <h2>Catégories</h2>
    <div class="grid">
      <a class="card" href="/wave" style="background:#1DC4F5;color:#0b2a5b">
        <div class="logo"><img src="wave.png" alt="Wave"/></div>
        <div><div class="name">Wave</div><div class="tag">Mobile Money</div></div>
      </a>
      <a class="card" href="/attijari" style="background:#E30613">
        <div class="logo"><img src="attijari.png" alt="Attijari Bank"/></div>
        <div><div class="name">Attijari Bank</div><div class="tag">Banque</div></div>
      </a>
      <a class="card" href="/wafacash" style="background:#00A651">
        <div class="logo"><img src="wafacash.png" alt="Wafacash"/></div>
        <div><div class="name">Wafacash</div><div class="tag">Transfert d'argent</div></div>
      </a>
      <a class="card" href="/cih" style="background:#008C44">
        <div class="logo"><img src="cih.png" alt="CIH Bank"/></div>
        <div><div class="name">CIH Bank</div><div class="tag">Banque</div></div>
      </a>
    </div>
    <p class="footer">© <span id="y"></span> PayZone Afrique</p>
  </main>
</div>
<script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
