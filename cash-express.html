<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Wafacash — Émission Cash Express</title>
<meta name="theme-color" content="#00A651"/>
<link rel="icon" href="favicon.ico"/>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f4f6f8;color:#123B28}
  header{background:linear-gradient(135deg,#00A651,#00753A);color:#fff;padding:18px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  header img{height:34px;background:#fff;border-radius:6px;padding:4px}
  header h1{margin:0;font-size:17px;font-weight:700}
  header small{display:block;opacity:.9;font-size:12px}
  .back{margin-left:auto;color:#fff;text-decoration:none;font-size:22px;padding:4px 10px;border-radius:8px;background:rgba(0,0,0,.15)}
  main{max-width:720px;margin:0 auto;padding:14px}
  .card{background:#fff;border-radius:14px;padding:14px 14px 4px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .card h2{margin:0 0 10px;font-size:14px;color:#00753A;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #E7F7EE;padding-bottom:6px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row.one{grid-template-columns:1fr}
  .field{margin-bottom:10px}
  label{display:block;font-size:12px;color:#4a5b52;margin-bottom:4px;font-weight:600}
  input,select,textarea{width:100%;border:1px solid #d5dbd7;border-radius:10px;padding:10px 12px;font-size:15px;background:#fff;color:#123B28;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#00A651;box-shadow:0 0 0 3px #E7F7EE}
  textarea{min-height:70px;resize:vertical}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}
  .check input{width:auto}
  .amounts{background:#F7FBF8;border:1px dashed #b7d7c4;border-radius:10px;padding:10px;margin-top:6px}
  .amounts .line{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
  .amounts .total{border-top:1px solid #b7d7c4;margin-top:6px;padding-top:8px;font-weight:800;font-size:16px;color:#00753A}
  .actions{display:flex;gap:10px;padding:6px 0 20px}
  button{flex:1;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
  .btn-primary{background:linear-gradient(135deg,#00A651,#00753A);color:#fff}
  .btn-ghost{background:#fff;color:#00753A;border:1px solid #00A651}
  .err{color:#b00020;font-size:12px;margin-top:4px;display:none}
  .err.on{display:block}
</style>
</head>
<body>
<header>
  <img src="wafacash.png" alt="Wafacash"/>
  <div>
    <h1>Cash Express</h1>
    <small>Émission — Reçu Client</small>
  </div>
  <a class="back" href="/wafacash" aria-label="Retour">×</a>
</header>

<main>
  <form id="f" novalidate>
    <section class="card">
      <h2>En-tête</h2>
      <div class="row">
        <div class="field"><label>Agence</label><input name="agence" value="CASA MAZOLA (AFN)(2811) - AFN0120"/></div>
        <div class="field"><label>N° de transfert</label><input name="ntransfert" placeholder="240 367 734 240"/></div>
        <div class="field"><label>Réf. entreprise</label><input name="ref"/></div>
        <div class="field"><label>Date</label><input name="date" type="date"/></div>
      </div>
    </section>

    <section class="card">
      <h2>Expéditeur</h2>
      <div class="row">
        <div class="field"><label>Nom / Prénom *</label><input name="exp_nom" required/><div class="err">Requis</div></div>
        <div class="field"><label>Ville</label><input name="exp_ville"/></div>
        <div class="field"><label>Téléphone</label><input name="exp_tel" inputmode="tel"/></div>
        <div class="field"><label>Type de pièce</label>
          <select name="exp_type"><option>CIN</option><option>Passeport</option><option>Permis</option><option>Carte séjour</option></select>
        </div>
        <div class="field"><label>N° pièce (PID N°)</label><input name="exp_pid"/></div>
        <div class="field"><label>Date d'expiration (PID Exp.)</label><input name="exp_pidexp" type="date"/></div>
      </div>
    </section>

    <section class="card">
      <h2>Bénéficiaire</h2>
      <div class="row">
        <div class="field"><label>Nom / Prénom *</label><input name="ben_nom" required/><div class="err">Requis</div></div>
        <div class="field"><label>Ville</label><input name="ben_ville"/></div>
        <div class="field"><label>Téléphone</label><input name="ben_tel" inputmode="tel"/></div>
        <div class="field"><label>Type de pièce</label>
          <select name="ben_type"><option value=""></option><option>CIN</option><option>Passeport</option><option>Permis</option><option>Carte séjour</option></select>
        </div>
        <div class="field"><label>N° pièce (PID N°)</label><input name="ben_pid"/></div>
        <div class="field"><label>Date d'expiration (PID Exp.)</label><input name="ben_pidexp" type="date"/></div>
      </div>
    </section>

    <section class="card">
      <h2>Notifications (optionnel)</h2>
      <label class="check"><input type="checkbox" name="sms_ben"/> SMS Bénéficiaire</label>
      <label class="check"><input type="checkbox" name="sms_exp"/> SMS Expéditeur</label>
    </section>

    <section class="card">
      <h2>Raison</h2>
      <div class="field row one"><label>Motif du transfert</label>
        <textarea name="raison" placeholder="Ex : je peux payer mes impôts…"></textarea>
      </div>
    </section>

    <section class="card">
      <h2>Montant</h2>
      <div class="row">
        <div class="field"><label>Montant envoyé (MAD) *</label>
          <input name="montant" type="number" step="0.01" min="0" required oninput="calc()"/>
          <div class="err">Requis</div>
        </div>
        <div class="field"><label>Total frais HT (MAD)</label>
          <input name="frais" type="number" step="0.01" min="0" value="74.74" oninput="calc()"/>
        </div>
      </div>
      <div class="amounts">
        <div class="line"><span>Montant envoyé</span><b id="a-envoye">0,00 MAD</b></div>
        <div class="line"><span>Total frais HT (*)</span><b id="a-frais">0,00 MAD</b></div>
        <div class="line"><span>TVA (10%) (**)</span><b id="a-tva">0,00 MAD</b></div>
        <div class="line total"><span>Total à payer</span><b id="a-total">0,00 MAD</b></div>
      </div>
    </section>

    <div class="actions">
      <button type="button" class="btn-ghost" onclick="history.back()">Annuler</button>
      <button type="submit" class="btn-primary">Valider</button>
    </div>
  </form>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const f = document.getElementById('f');

function fmt(n){
  n = Number(n)||0;
  const [i,d]=n.toFixed(2).split('.');
  const withSep=i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return withSep+','+d+' MAD';
}
function calc(){
  const m = Number(f.montant.value)||0;
  const fr = Number(f.frais.value)||0;
  const tva = +(fr*0.10).toFixed(2);
  const total = +(m + fr + tva).toFixed(2);
  $('#a-envoye').textContent = fmt(m);
  $('#a-frais').textContent = fmt(fr);
  $('#a-tva').textContent = fmt(tva);
  $('#a-total').textContent = fmt(total);
  return {m, fr, tva, total};
}
// init date to today
f.date.value = new Date().toISOString().slice(0,10);
// generate a transfer number if empty on focus
// auto-gen removed
calc();

function frDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

f.addEventListener('submit', e => {
  e.preventDefault();
  let ok = true;
  ['exp_nom','ben_nom','montant'].forEach(k=>{
    const el = f[k]; const err = el.parentElement.querySelector('.err');
    if(!el.value.trim()){ err.classList.add('on'); ok=false; } else err.classList.remove('on');
  });
  if(!ok){ window.scrollTo({top:0,behavior:'smooth'}); return; }
  const totals = calc();
  buildPDF(totals);
});

/* ---------- Rendu du texte ARABE ----------
   jsPDF (polices standard) ne sait pas écrire l'arabe (pas de liaison des
   lettres ni de sens RTL). On laisse donc le navigateur composer le texte
   arabe dans un SVG, on le convertit en image PNG, puis on l'insère dans le
   PDF aux coordonnées exactes. Le rendu est donc identique au modèle papier. */
const AR_CACHE = new Map();
function arRender(text, px, bold){
  const key = px+'|'+(bold?1:0)+'|'+text;
  if(AR_CACHE.has(key)) return AR_CACHE.get(key);
  const p = new Promise(res=>{
    const w = Math.ceil(px*text.length*0.85)+24, h = Math.ceil(px*1.7);
    const esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'+
      '<foreignObject width="100%" height="100%">'+
      '<div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" lang="ar" style="margin:0;'+
      'font-family:\'Noto Naskh Arabic\',\'Amiri\',\'Traditional Arabic\',\'Geeza Pro\',\'Segoe UI\',sans-serif;'+
      'font-size:'+px+'px;font-weight:'+(bold?'700':'400')+';color:#000;line-height:'+Math.round(px*1.5)+'px;'+
      'text-align:right;white-space:nowrap">'+esc+'</div></foreignObject></svg>';
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas');
      c.width = w*3; c.height = h*3;
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height);
      x.scale(3,3); x.drawImage(img,0,0);
      res({url:c.toDataURL('image/png'), ratio:w/h});
    };
    img.onerror = ()=>res(null);
    img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
  AR_CACHE.set(key,p);
  return p;
}
// place une image arabe : hmm = hauteur en mm, align 'right' | 'left'
async function arPut(doc, text, x, y, hmm, align, bold){
  const im = await arRender(text, 40, bold);
  if(!im) return;
  const wmm = hmm * im.ratio;
  const px = align === 'right' ? x - wmm : x;
  doc.addImage(im.url, 'PNG', px, y, wmm, hmm);
}

async function buildPDF(t){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:[297,172], orientation:'landscape'});
  const W = doc.internal.pageSize.getWidth();   // 297
  const g = f;
  const M = 10;
  const colW = (W - 2*M - 8) / 2;               // largeur d'une colonne
  const xL = M, xR = M + colW + 8;
  const K = [0,0,0];
  doc.setTextColor(...K); doc.setDrawColor(...K);

  // ---------- EN-TETE ----------
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('Wafacash', xL+2, 14);
  doc.setFont('helvetica','normal'); doc.setFontSize(7);
  doc.text('Groupe Attijariwafa bank', xL+2, 18);
  await arPut(doc, 'وفاكاش', xL+2, 19.5, 5, 'left', true);
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('Cash  Xpress', W-M-2, 14, {align:'right'});
  await arPut(doc, 'كاش إكسبريس', W-M-2, 15.5, 5, 'right', true);

  doc.setFontSize(13);
  doc.text('EMISSION CASH EXPRESS', xL+2, 28);
  await arPut(doc, 'إصدار كاش إكسبريس', xL+2, 29.5, 5.2, 'left', true);

  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text('Agence     : ' + (g.agence.value||''), xL+2, 38);
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('Reçu Client', 150, 30);
  await arPut(doc, 'وصل الزبون', 150, 31.5, 4.6, 'left', true);

  const xh = 190;
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('N°TRANSFERT :   ' + (g.ntransfert.value||''), xh, 24);
  await arPut(doc, 'رقم التحويل', W-M-2, 25, 4.2, 'right');
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text('REF.ENTREPRISE : ' + (g.ref.value||''), xh, 31);
  await arPut(doc, 'مرجع المؤسسة', W-M-2, 32, 4.2, 'right');
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('DATE :   ' + frDate(g.date.value), xh, 38);
  await arPut(doc, 'التاريخ', W-M-2, 39, 4.2, 'right');

  doc.setLineWidth(0.4);
  doc.line(M, 43, W-M, 43);

  // ---------- CADRES EXPEDITEUR / BENEFICIAIRE ----------
  const boxY = 53, rowH = 8.5, boxH = rowH*4;
  async function party(x, title, titleAr, d){
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text(title, x+2, boxY-2);
    const tw = doc.getTextWidth(title);
    doc.setLineWidth(0.5); doc.line(x+2, boxY-1, x+2+tw, boxY-1);
    await arPut(doc, titleAr, x+colW, boxY-5.2, 4.6, 'right', true);

    doc.setLineWidth(0.3);
    doc.rect(x, boxY, colW, boxH);
    for(let i=1;i<4;i++) doc.line(x, boxY+i*rowH, x+colW, boxY+i*rowH);
    const xs = x + colW*0.62;                  // séparation colonne droite
    doc.line(xs, boxY+rowH, xs, boxY+2*rowH);  // Ville | Tél
    doc.line(xs, boxY+3*rowH, xs, boxY+4*rowH);// PID N° | PID Exp

    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    const lab = (txt,cx,r)=>doc.text(txt, cx+2, boxY+r*rowH+5.6);
    const val = (txt,cx,r)=>{doc.setFont('helvetica','bold');doc.text(txt||'', cx, boxY+r*rowH+5.6);doc.setFont('helvetica','normal');};
    lab('Nom / Prénom  :', x, 0);   val(d.nom,  x+34, 0);
    lab('Ville         :', x, 1);   val(d.ville,x+34, 1);
    lab('Tél :', xs, 1);            val(d.tel,  xs+12, 1);
    lab('Type pièce    :', x, 2);   val(d.type, x+34, 2);
    lab('PID N°        :', x, 3);   val(d.pid,  x+34, 3);
    lab('PID Exp :', xs, 3);        val(frDate(d.pidexp), xs+20, 3);
  }
  await party(xL, 'EXPEDITEUR', 'المرسل', {nom:g.exp_nom.value, ville:g.exp_ville.value, tel:g.exp_tel.value,
    type:g.exp_type.value, pid:g.exp_pid.value, pidexp:g.exp_pidexp.value});
  await party(xR, 'BENEFICIAIRE', 'المستفيد', {nom:g.ben_nom.value, ville:g.ben_ville.value, tel:g.ben_tel.value,
    type:g.ben_type.value, pid:g.ben_pid.value, pidexp:g.ben_pidexp.value});

  // ---------- NOTIFICATIONS (gauche) / MONTANTS (droite) ----------
  const y2 = boxY + boxH + 8;
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('Notifications', xL+2, y2);
  doc.setLineWidth(0.4); doc.line(xL+2, y2+1, xL+2+doc.getTextWidth('Notifications'), y2+1);
  await arPut(doc, 'الإشعارات', xL+colW, y2-3.4, 4.4, 'right', true);
  doc.setFont('helvetica','normal');
  const cbox = (x,y,on)=>{ doc.setLineWidth(0.3); doc.rect(x,y,3.2,3.2);
    if(on){ doc.setLineWidth(0.5); doc.line(x+.5,y+1.6,x+1.4,y+2.7); doc.line(x+1.4,y+2.7,x+2.8,y+.6); } };
  cbox(xL+2, y2+4, g.sms_ben.checked);
  doc.text('Bénéficiaire (SMS)', xL+7, y2+6.8);
  doc.text('Frais SMS HT :', xL+62, y2+6.8);  doc.text('0,00', xL+95, y2+6.8);
  cbox(xL+2, y2+11, g.sms_exp.checked);
  doc.text('Expéditeur (SMS)', xL+7, y2+13.8);
  doc.text('Tva SMS (20%) :', xL+62, y2+13.8); doc.text('0,00', xL+95, y2+13.8);

  doc.setFontSize(11);
  let ry = y2 + 2;
  const rline = (label, val, bold) => {
    doc.setFont('helvetica', bold?'bold':'normal');
    doc.text(label, xR+2, ry);
    doc.text(val, xR+colW-2, ry, {align:'right'});
    ry += 7.5;
  };
  const arMontants = [
    ['المبلغ المرسل', 0],
    ['مجموع المصاريف', 1],
    ['الرسم على القيمة المضافة', 2],
    ['المبلغ الإجمالي', 3]
  ];
  rline('Montant envoyé :', fmt(t.m));
  rline('Total Frais HT (*) :', fmt(t.fr));
  rline('TVA (10%) (**) :', fmt(t.tva));
  doc.setLineWidth(0.3); doc.line(xR+2, ry-4.5, xR+colW-2, ry-4.5);
  rline('Total à payer', fmt(t.total), true);
  for(const [txt,i] of arMontants){
    await arPut(doc, txt, xR+colW*0.70, y2 - 1.4 + i*7.5, 4, 'right', i===3);
  }

  // ---------- RAISON (gauche) / SIGNATURES (droite) ----------
  const y3 = y2 + 28, bH = 27;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text('Raison', xL+2, y3+4);
  await arPut(doc, 'السبب', xL+2, y3+5.5, 4, 'left');
  doc.setLineWidth(0.3);
  doc.rect(xL+20, y3, colW-20, bH);
  const raison = doc.splitTextToSize(g.raison.value||'', colW-26);
  doc.text(raison, xL+23, y3+6);

  doc.rect(xR, y3, colW, bH);
  doc.line(xR+colW/2, y3, xR+colW/2, y3+bH);
  doc.setFontSize(8.5);
  doc.text('Signature du client (*)', xR+3, y3+5);
  doc.text("Signature et cachet de l'agence", xR+colW/2+3, y3+5);
  await arPut(doc, 'توقيع الزبون', xR+colW/2-3, y3+6.5, 4, 'right');
  await arPut(doc, 'توقيع وخاتم الوكالة', xR+colW-3, y3+6.5, 4, 'right');

  // ---------- PIED DE PAGE ----------
  const y4 = y3 + bH + 6;
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text("Veuillez conserver le reçu jusqu'au paiement du bénéficiaire", M, y4);
  doc.text('WAFACASH VOUS REMERCIE POUR VOTRE CONFIANCE', W-M, y4, {align:'right'});
  await arPut(doc, 'يرجى الاحتفاظ بهذا الوصل إلى حين دفع المبلغ للمستفيد', M, y4+1.5, 4.2, 'left', true);
  await arPut(doc, 'وفاكاش تشكركم على ثقتكم', W-M, y4+1.5, 4.2, 'right', true);
  doc.setFont('helvetica','normal'); doc.setFontSize(7);
  doc.text('(**) Y compris les droits de timbre', M, y4+8);
  doc.setFontSize(5.6);
  doc.text('(*) LES CONDITIONS GENERALES AYANT TRAIT AUX SERVICES DU CASH EXPRESS SONT DISPONIBLES DANS VOTRE AGENCE. EN SIGNANT CE REÇU VOUS ADHEREZ A CES CONDITIONS.', M, y4+11);
  doc.text('S.A. AU CAPITAL DE 35.050.000 DH - SIEGE SOCIAL 15, RUE DRISS LAHRIZI, CASABLANCA - TEL : 05.22.27.27.55 - FAX : 05.22.26.01.03 - R.C. : 60809 - I.F. : 01084028 - PATENTE : 33251001 - CNSS : 2113801', M, y4+14);

  const name = 'cash-express-' + (g.ntransfert.value||'recu').replace(/\s+/g,'') + '.pdf';
  doc.save(name);
}
</script>
</body>
</html>
