<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>CIH Bank — PayZone Afrique</title>
<link rel="stylesheet" href="bank.css"/>
</head>
<body>

<!-- ── Header ── -->
<div class="bk-header" style="background:linear-gradient(145deg,#005F30,#003d1f)">
  <div class="bk-topbar">
    <a class="bk-back" href="index.html" style="color:white">←</a>
    <div class="bk-brand">
      <!-- CIH Bank logo inline -->
      <svg width="36" height="36" viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="64" height="64" rx="16" fill="white"/>
        <text x="35" y="38" text-anchor="middle" font-family="'Arial Black','Arial',sans-serif" font-weight="900" font-size="19" fill="#005F30" letter-spacing="-1">CIH</text>
        <rect x="15" y="45" width="40" height="4" rx="2" fill="#005F30"/>
        <rect x="10" y="20" width="4" height="30" rx="2" fill="#7BC67E"/>
        <rect x="56" y="20" width="4" height="30" rx="2" fill="#7BC67E"/>
      </svg>
      <span class="bk-brand-name" style="color:white">CIH Bank</span>
    </div>
    <div class="bk-avatar">👤</div>
  </div>
  <div class="bk-balance-wrap" style="color:white">
    <div class="bk-bal-label">Solde disponible</div>
    <div class="bk-bal-row">
      <span class="bk-bal-amount" id="bal-display">•••••• F</span>
      <button id="btn-toggle-bal" style="background:none;border:none;cursor:pointer;font-size:20px;opacity:.8;color:white" aria-label="Afficher/masquer">👁</button>
    </div>
    <div style="font-size:12px;opacity:.7;margin-top:4px">La banque qui vous ressemble</div>
  </div>
</div>

<!-- ── Contenu flottant ── -->
<div class="bk-content">

  <!-- Actions -->
  <div class="actions-card">
    <div class="action-btn" id="btn-send">
      <div class="action-ic" style="background:#d1fae5"><span style="font-size:22px">↗</span></div>
      <span class="action-label">Envoyer</span>
    </div>
    <div class="action-btn" id="btn-recv">
      <div class="action-ic" style="background:#d1fae5"><span style="font-size:22px">↙</span></div>
      <span class="action-label">Recevoir</span>
    </div>
    <div class="action-btn" id="btn-bill">
      <div class="action-ic" style="background:#d1fae5"><span style="font-size:22px">🧾</span></div>
      <span class="action-label">Factures</span>
    </div>
    <div class="action-btn" id="btn-withdraw">
      <div class="action-ic" style="background:#d1fae5"><span style="font-size:22px">🏧</span></div>
      <span class="action-label">Retrait</span>
    </div>
  </div>

  <!-- Comptes -->
  <div class="acc-cards">
    <div class="acc-card">
      <div class="acc-card-type">Compte courant</div>
      <div class="acc-card-num">**** 2290</div>
      <div class="acc-card-bal" id="card-balance">— F</div>
    </div>
    <div class="acc-card">
      <div class="acc-card-type">Épargne</div>
      <div class="acc-card-num">**** 5517</div>
      <div class="acc-card-bal">0 F</div>
    </div>
  </div>

  <!-- Transactions -->
  <div class="tx-section">
    <div class="tx-head">
      <span class="tx-head-title">Transactions</span>
      <span class="tx-head-sub">Historique</span>
    </div>
    <div class="tx-list-wrap" id="tx-list"></div>
  </div>

  <div class="bk-footer">CIH Bank — Powered by PayZone Afrique</div>
</div>

<!-- ── Modal ── -->
<div class="modal" id="tx-modal">
  <div class="modal-bg" id="modal-bg"></div>
  <div class="modal-sheet" id="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-inner">
      <div class="modal-hdr">
        <span class="modal-title" id="modal-title">Opération</span>
        <span class="modal-close" id="modal-close">×</span>
      </div>
      <div class="modal-label-row" id="modal-label-row">
        <div class="modal-field-label" id="modal-label-title">Bénéficiaire</div>
        <input class="modal-input" id="modal-label" placeholder="Nom / N° compte"/>
      </div>
      <div class="modal-field-label">Montant (FCFA)</div>
      <input class="modal-input" id="modal-amount" type="number" placeholder="0" style="font-size:22px;font-weight:700;margin-top:6px"/>
      <button class="modal-btn" id="modal-submit" style="color:white">Valider</button>
    </div>
  </div>
</div>

<script src="bank.js"></script>
<script>
initBankApp({
  key: 'cih',
  primary: '#005F30',
  onPrimary: '#ffffff',
  accent: '#d1fae5'
});
</script>
</body>
</html>
